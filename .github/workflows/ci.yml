# Continuous integration for safeexpr.
#
# Every lane below is invoked through `scripts/lanes.py`, never by spelling out a pytest or ruff
# command here. Two spellings of "how this project runs its checks" is how a lane ends up with one
# set of flags locally and another in CI, and the difference only surfaces when the two disagree
# about a failure. `tests/test_lanes.py` asserts that every lane the runner knows about is named
# in this file, so a lane cannot be added and left unwired.
#
# Third-party actions are pinned to a commit SHA with the tag in a trailing comment. A floating
# tag is a mutable reference to somebody else's code with a token in scope. Re-pin deliberately,
# reading the diff, rather than by moving the tag.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static gates. Linux only: nothing these tools check is platform-dependent, and `src/` has no
  # `sys.platform` branch that would narrow a type differently elsewhere.
  #
  # ruff and mypy are both here and they are not redundant. ruff's `target-version = "py310"` is
  # what stops 3.12+ *syntax* reaching `src/`; mypy's `python_version = "3.11"` checks the floor's
  # *semantics*. Neither sees what the other does.
  # ---------------------------------------------------------------------------
  gates:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py gates
      - run: uv run --frozen python scripts/lanes.py format
      - run: uv run --frozen python scripts/lanes.py types

  # ---------------------------------------------------------------------------
  # The lane that proves the product claim.
  #
  # R1 is the pitch: `pip install safeexpr` pulls exactly one pure-Python wheel. `tests/
  # test_zero_deps.py` reads METADATA and runs everywhere, but it cannot catch a module that grew
  # an eager third-party import, because the development environment has that import available
  # and it simply succeeds. **The isolation is the lane**: this builds a wheel, installs it alone
  # into an interpreter created with `--no-project`, and fails if anything outside the standard
  # library arrives in `sys.modules`. It also checks the wheel is tagged `py3-none-any`, because
  # "no dependencies" and "no compiled artifact" are two separate halves of the same promise.
  # ---------------------------------------------------------------------------
  zero-deps:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install
      - run: uv run --no-project --python 3.13 python scripts/lanes.py zero-deps

  # ---------------------------------------------------------------------------
  # The lane that proves the *distribution* claim, as opposed to the package claim above.
  #
  # `tests/` and `corpus/` ship in the sdist deliberately, because downstream packagers rebuild
  # from it and run this suite to validate the build, and for this package that matters more than
  # usual: the corpus is the security argument, and a distribution carrying the code without the
  # tests that prove it is shipping an unverifiable claim.
  #
  # That is a promise about an artifact nothing else here ever runs. A checkout has `.github/`,
  # `.git`, `uv.lock` and a synced environment; the distribution has none of them. This builds the
  # sdist, builds the wheel *from* it, installs that wheel into an interpreter holding only a test
  # runner, and runs the shipped suite from the unpacked tree.
  # ---------------------------------------------------------------------------
  sdist:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install
      - run: uv run --no-project --python 3.13 python scripts/lanes.py sdist

  # ---------------------------------------------------------------------------
  # The unit suite on the development interpreter, on both platforms.
  #
  # macOS is here rather than for completeness. This package's limits are measured in interpreter
  # behaviour: the `ast.parse` bound that `MemoryError`s at ~5,900 nesting levels was measured on
  # Linux, and a bound that differs by platform would make the documented source-length cap wrong
  # somewhere. Cheap to check, expensive to discover from a bug report.
  # ---------------------------------------------------------------------------
  fast:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py fast

  # ---------------------------------------------------------------------------
  # The escape corpus, on its own, on every supported interpreter.
  #
  # It runs inside `fast` and `compat` too, since it is ordinary pytest. It gets a job of its own
  # because it is the artifact a security reviewer asks to see, and "find the corpus lines in a
  # 240-test run" is a worse answer than a job whose whole output is the corpus.
  #
  # The matrix is not decoration here. Some entries are interpreter-dependent: t-strings parse on
  # 3.14 and are a syntax error before it, so the same attack is rejected at a different stage on
  # either side of that line.
  # ---------------------------------------------------------------------------
  corpus:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv venv .venv-compat --python ${{ matrix.python }}
      - run: uv pip install --python .venv-compat/bin/python -e . pytest hypothesis
      - run: .venv-compat/bin/python scripts/lanes.py corpus

  # ---------------------------------------------------------------------------
  # The numbers, and the gate that keeps them.
  #
  # **Before this job existed the benchmark suite ran nowhere.** `tests/benchmarks/` had been in
  # the repository since the tier work, `.benchmarks/` held seven saved baselines, `CLAUDE.md`
  # mandated a 10% regression gate, and none of the eight lanes executed any of it. A win with no
  # gate is a temporary win.
  #
  # **The baseline is the merge base, benchmarked on this runner in these minutes**, which is the
  # only option whose comparison is not confounded by the thing it is trying to measure. The two
  # alternatives were considered and rejected: committing baselines ages them against a moving
  # runner fleet and makes the refresh a chore nobody owns, and `.benchmarks/` is git-ignored
  # precisely so that cannot start happening by accident. It costs roughly double the runtime,
  # which for one job of a few minutes is the cheapest part of this decision.
  #
  # **The head is run twice, and the second run is not a duplicate.** Comparing it against the
  # first gives this runner's own noise floor for this run, printed above the gate, so a red row
  # can be read against the variance it was measured in rather than against a number somebody
  # wrote down once. A gate below the runner's own variance fails on green commits, and a gate
  # that fails on green commits is disabled within a month.
  #
  # **The threshold is `min:15%`, and it comes from that measurement rather than from a round
  # number.** Two runs of identical code on this runner, 43 rows each, worst single-row deviation:
  #
  #     run 1     min 3.9%   median 4.1%   mean 5.0%
  #     run 2     min 4.4%   median 4.1%   mean 4.4%
  #
  # 15% is 3.4x the worst of those. It is not tighter because the estimate is two samples, and a
  # gate at 2x a two-sample estimate of a noise floor is a gate that fails on a green commit
  # eventually.
  #
  # **`min` rather than `mean`, and that is the part worth arguing.** `CLAUDE.md` asked for a
  # mean-time gate. On the development machine, two runs of identical code gave min 2.7%, median
  # 9.2% and **mean 32.2%**: one 147x outlier in twenty thousand rounds moves the mean further
  # than any effect being measured. This runner is quieter than that box and all three statistics
  # agree here, which is the opposite of what was expected, but the gate has to hold on the noisier
  # machine too and `scripts/measure.py` refuses to be set on the mean at its argument parser.
  #
  # One job, one interpreter. The `compat` and `corpus` rows build minimal environments with
  # pytest and hypothesis only, deliberately, and dragging a benchmark stack onto each would slow
  # every one of them to measure something only meaningful on a stable machine.
  # ---------------------------------------------------------------------------
  measure:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base has to be reachable, and the default shallow clone does not reach it.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install
      # `measure` is not a default group, so this is the only lane that installs it. That is the
      # whole zero-dependency argument: the environment that runs the tests of a package with no
      # dependencies does not quietly acquire `rich`, `textual` and a compiled tracer.
      - run: uv sync --frozen --group measure

      # The lane itself: timings, allocation ceilings, import-time tripwire.
      - run: uv run --frozen --group measure python scripts/lanes.py measure
      - run: cp .benchmarks/measure.json head-a.json

      # The same commit again, for the noise floor.
      - name: Measure this runner's own variance
        run: |
          uv run --frozen --group measure python scripts/measure.py \
            --timings-only --out head-b.json
          uv run --frozen --group measure python scripts/measure.py \
            --compare head-a.json head-b.json \
            --label "this runner's noise floor: identical code, two runs"

      - name: Benchmark the merge base on this runner
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          git checkout --detach "$BASE_SHA"
          # The base may predate this script, in which case there is no baseline and the step
          # below says so rather than the job failing on a file that was never going to exist.
          uv run --frozen --group measure python scripts/measure.py \
            --timings-only --out base.json || echo "no measure.py on the base commit"
          git checkout --detach "$head_sha"

      - name: Compare against the merge base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ ! -f base.json ]; then
            echo "no baseline from the merge base; nothing to compare"
            exit 0
          fi
          uv run --frozen --group measure python scripts/measure.py \
            --compare base.json head-a.json \
            --label "merge base against this head, same runner" \
            --fail-over min:15%

  # ---------------------------------------------------------------------------
  # Every supported interpreter.
  #
  # **This matrix is load-bearing rather than routine.** Most libraries matrix on Python to catch
  # syntax and API drift. This one matrices because the answers it depends on are interpreter
  # behaviour, and several of them were measured to differ:
  #
  #   - 3.14 added `TemplateStr` and `Interpolation` (t-strings, PEP 750) as *expression* nodes,
  #     so they are reachable in `mode="eval"` and the allowlist has to reject them. That
  #     rejection can only be tested where the syntax parses.
  #   - `AttributeError.obj`, the F9 leak, exists from 3.10 on, so it is present on every
  #     supported version and its corpus entries are unconditional.
  #   - **3.11's parser gives out at 2,989 levels of operator nesting against ~5,975 elsewhere**,
  #     raises `RecursionError` where the others raise `MemoryError`, and is the only supported
  #     version whose bound moves with `sys.setrecursionlimit`. It sets `MAX_SOURCE_BYTES`.
  #
  # A corpus entry asserting "structurally unreachable" means nothing on one interpreter.
  #
  # **3.11 is named explicitly and that is deliberate.** The development environment this project
  # was scaffolded in has 3.9, 3.10, 3.12, 3.13 and 3.14 installed but *not* 3.11, so a matrix
  # written from what happened to be on the box would have skipped it silently. It was skipping
  # the one version whose parser bound differs, which is how the source cap came to be wrong.
  #
  # 3.13 is absent here because `fast` already runs it as the development interpreter. The four
  # supported versions are covered by the two jobs together.
  #
  # **Deliberately unlocked, and that is not laziness.** `uv.lock` resolves for
  # `python_version >= '3.13'` so the toolchain is not dragged back to the floor to serve a
  # promise that is only about `src/`. Each row therefore builds its own environment.
  # ---------------------------------------------------------------------------
  compat:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv venv .venv-compat --python ${{ matrix.python }}
      - run: uv pip install --python .venv-compat/bin/python -e . pytest hypothesis
        # Invoked with the matrix row's own interpreter. `scripts/lanes.py` resolves a lane's tool
        # from the directory beside `sys.executable` before it looks at `.venv/`, which is what
        # makes this pick that row's pytest rather than the development one.
      - run: .venv-compat/bin/python scripts/lanes.py compat
